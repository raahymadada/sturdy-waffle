<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Zaeema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --pw: 300px;            /* page width  (set by JS) */
    --ph: 450px;            /* page height (set by JS) */
    --cs: 1;                /* closed-cover zoom (set by JS) */
    --top: 40px;            /* space above the card (set by JS) */
    --ink: #4a3a33;
    --cream: #f6efe2;
    --rose: #c9708c;
    --ease: cubic-bezier(.65,.02,.25,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    font-family:"Cormorant Garamond", Georgia, serif;
    color:var(--ink);
    background-color:#c6a27a;
    background-image:
      radial-gradient(ellipse at 20% 15%, rgba(255,240,215,.35), transparent 55%),
      radial-gradient(ellipse at 85% 80%, rgba(120,80,45,.22), transparent 60%),
      radial-gradient(circle at 70% 25%, rgba(140,95,55,.10) 0 6%, transparent 7%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .24  0 0 0 0 .14  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.55'/></svg>"),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.012 .09' numOctaves='2' seed='7'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .32  0 0 0 0 .2  0 0 0 .35 0'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>");
    box-shadow: inset 0 0 160px rgba(70,40,15,.35);
    min-height:100%;
  }

  /* ---------- stage & book ---------- */
  .stage{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center;
    padding-top:var(--top);
    transition: padding-top .9s var(--ease);
  }
  body.open .stage{ padding-top:var(--top-open); }
  .book-wrap{ width:calc(var(--pw)*2); height:calc(var(--ph) * var(--cs)); display:flex; align-items:center; justify-content:center; transition:height .9s var(--ease); }
  body.open .book-wrap{ height:var(--ph); }
  .book{
    position:relative;
    width:calc(var(--pw)*2); height:var(--ph);
    perspective: calc(var(--pw) * 5);
    transform-origin: 75% 50%;
    transform: translateX(calc(var(--pw) * -0.5)) scale(var(--cs));
    transition: transform .9s var(--ease);
  }
  body.open .book{ transform:none; }

  .page, .cover{ position:absolute; top:0; left:var(--pw); width:var(--pw); height:var(--ph); }
  .page{
    border-radius:3px 6px 6px 3px; overflow:hidden;
    box-shadow: 0 1px 0 rgba(255,255,255,.4) inset, 0 14px 30px -10px rgba(60,30,10,.55), 0 3px 8px rgba(60,30,10,.25);
    background:#f3d6d2;
  }
  .page::after{ /* spine shading */
    content:""; position:absolute; inset:0 auto 0 0; width:14%;
    background:linear-gradient(90deg, rgba(80,40,30,.22), rgba(80,40,30,0)); pointer-events:none;
  }
  .cover{
    z-index:5; transform-origin:0 50%;
    transform-style:preserve-3d;
    transition: transform .9s var(--ease);
  }
  body.open .cover{ transform: rotateY(-180deg); }
  .face{
    position:absolute; inset:0; overflow:hidden; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:3px 6px 6px 3px;
    box-shadow: 0 14px 30px -10px rgba(60,30,10,.55), 0 3px 8px rgba(60,30,10,.25);
  }
  .face.front{ cursor:pointer; }
  .face.back{ transform:rotateY(180deg); border-radius:6px 3px 3px 6px; pointer-events:none; }
  body.open .face.back{ pointer-events:auto; }
  body.open .face.front{ pointer-events:none; }
  .face.back::after{
    content:""; position:absolute; inset:0 0 0 auto; width:14%;
    background:linear-gradient(270deg, rgba(80,40,30,.22), rgba(80,40,30,0)); pointer-events:none;
  }
  .fill{ position:absolute; inset:0; width:100%; height:100%; display:block; object-fit:cover; user-select:none; -webkit-user-drag:none; }

  /* washi tape on the closed cover */
  .tape{ position:absolute; width:28%; height:6%; background:rgba(244,214,160,.72);
    box-shadow:0 1px 2px rgba(0,0,0,.12); mix-blend-mode:multiply; z-index:2; pointer-events:none;
    -webkit-mask: linear-gradient(90deg,transparent 0 2px,#000 2px calc(100% - 2px),transparent 0),
                  repeating-linear-gradient(0deg,#000 0 3px,transparent 3px 5px);
  }
  .tape.t1{ top:-2%; left:-6%; transform:rotate(-32deg); }
  .tape.t2{ top:-2%; right:-6%; transform:rotate(30deg); background:rgba(214,170,196,.7); }

  /* ---------- letter page ---------- */
  .letter-peek{
    position:absolute; left:36.6%; top:10.4%; width:24%; aspect-ratio: 851/1199;
    cursor:pointer; transition: transform .35s var(--ease);
    filter: drop-shadow(0 2px 3px rgba(80,40,30,.25));
  }
  .letter-peek img{ width:100%; height:100%; display:block; }
  .letter-peek:hover, .letter-peek:focus-visible{ transform:translateY(-4%) rotate(-1deg); outline:none; }
  body.open .letter-peek{ animation: nudge 3.2s 1.4s ease-in-out infinite; }
  @keyframes nudge{ 0%,78%,100%{transform:none} 84%{transform:translateY(-5%) rotate(-1.2deg)} 90%{transform:translateY(-1%)} }
  .letter-peek.gone{ visibility:hidden; animation:none !important; }
  .env-front{ clip-path: inset(16.83% 6.42% 16.5% 16.08%); cursor:pointer; }

  /* lifted letter (fixed overlay, FLIP-animated) */
  .scrim{ position:fixed; inset:0; z-index:40; background:rgba(60,35,20,.38); opacity:0; pointer-events:none; transition:opacity .5s ease; backdrop-filter: blur(1.5px); }
  body.reading .scrim{ opacity:1; pointer-events:auto; }
  .letter-view{
    position:fixed; z-index:41; transform-origin:0 0; display:none; cursor:pointer;
    box-shadow: 0 24px 50px -12px rgba(40,20,10,.6), 0 4px 10px rgba(40,20,10,.25);
  }
  .letter-view img{ width:100%; height:100%; display:block; }
  .letter-hint{ position:fixed; z-index:42; left:50%; transform:translateX(-50%); color:#fff6ea; font-style:italic; font-size:16px;
    text-shadow:0 1px 3px rgba(0,0,0,.4); opacity:0; transition:opacity .4s; pointer-events:none; white-space:nowrap; }
  body.reading .letter-hint{ opacity:1; transition-delay:.6s; }

  /* ---------- cake page ---------- */
  .flame{
    position:absolute; transform-origin:50% 92%;
    will-change: transform, opacity;
  }
  .flame .glow{
    position:absolute; left:50%; top:45%; width:420%; aspect-ratio:1; transform:translate(-50%,-50%);
    background: radial-gradient(circle, rgba(255,214,140,.55), rgba(255,190,120,.18) 40%, transparent 68%);
    mix-blend-mode:screen; pointer-events:none; animation: glow 1.8s ease-in-out infinite alternate;
  }
  .flame img{ position:relative; width:100%; height:100%; display:block; transform-origin:50% 92%; animation: flicker .14s steps(2) infinite alternate, sway 2.4s ease-in-out infinite; }
  .flame.f1 img{ animation-delay:.07s, -1.1s; }
  @keyframes flicker{ from{ filter:brightness(1)} to{ filter:brightness(1.12) saturate(1.1)} }
  @keyframes sway{ 0%,100%{ transform:rotate(-3deg) scaleY(1)} 50%{ transform:rotate(3deg) scaleY(1.06)} }
  @keyframes glow{ from{opacity:.75} to{opacity:1} }
  .flame.out{ transition: opacity .35s ease, transform .35s ease; opacity:0 !important; }
  .flame.out .glow{ opacity:0; }
  .flame.relight{ animation: relight .6s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes relight{ from{ opacity:0; transform:var(--base) scale(.1) } to{ opacity:1; transform:var(--base) } }

  .wick{ position:absolute; width:.45%; height:1.3%; background:linear-gradient(#2d2320,#5a4038); border-radius:2px; opacity:0; transition:opacity .3s; }
  .wick::after{ content:""; position:absolute; left:50%; top:-15%; width:220%; aspect-ratio:1; transform:translateX(-50%); border-radius:50%;
    background:radial-gradient(circle,#ff6a3d,#ff6a3d00 70%); opacity:0; }
  .cake-page.dark .wick{ opacity:1; }
  .cake-page.dark .wick::after{ animation: ember 2.4s ease-out forwards; }
  @keyframes ember{ 0%{opacity:1} 100%{opacity:0} }
  .smoke{ position:absolute; width:3%; aspect-ratio:1; border-radius:50%; pointer-events:none;
    background: radial-gradient(circle, rgba(140,130,135,.55), rgba(140,130,135,0) 70%);
    filter: blur(1px); animation: smoke 2.6s ease-out forwards; }
  @keyframes smoke{
    0%{ transform:translate(-50%,0) scale(.6); opacity:0 }
    15%{ opacity:.9 }
    100%{ transform:translate(calc(-50% + var(--dx)), -260%) scale(2.6); opacity:0 }
  }

  /* make-a-wish slip */
  .wish{
    position:absolute; left:5%; right:5%; top:3%; height:36.5%; padding:3% 3% 4%;
    display:flex; flex-direction:column; justify-content:center;
    background:#fbf5ea; border-radius:2px;
    box-shadow:0 6px 14px -6px rgba(80,40,30,.45);
    transform: rotate(-2deg) translateY(-12%) scale(.9); opacity:0; pointer-events:none;
    transition: opacity .45s ease, transform .6s cubic-bezier(.3,1.5,.5,1);
    text-align:center;
    clip-path: polygon(0 3%,4% 0,9% 2%,15% 0,22% 3%,30% 1%,37% 3%,45% 0,53% 2%,61% 0,69% 3%,77% 1%,85% 3%,92% 0,100% 2%, 100% 97%,95% 100%,88% 98%,80% 100%,72% 97%,64% 100%,56% 98%,48% 100%,40% 97%,32% 100%,24% 98%,16% 100%,8% 97%,0 100%);
  }
  .cake-page.dark .wish{ opacity:1; transform: rotate(-2deg); }
  .wish .row{ display:flex; justify-content:center; flex-wrap:nowrap; gap: calc(var(--pw) * .006); margin: calc(var(--pw)*.012) 0; }
  .tile{
    font-family:"Bagel Fat One", "Arial Rounded MT Bold", system-ui, sans-serif;
    font-size: calc(var(--pw) * .05); line-height:1; width:1.25em; height:1.4em;
    display:inline-flex; align-items:center; justify-content:center;
    box-shadow:0 1px 2px rgba(0,0,0,.2);
    opacity:0; transform: translateY(-40%) rotate(var(--r)) scale(.6);
  }
  .tile.sp{ width:.5em; box-shadow:none; background:none !important; }
  .cake-page.dark .tile{ animation: tileIn .45s cubic-bezier(.3,1.6,.5,1) forwards; animation-delay: var(--d); }
  @keyframes tileIn{ to{ opacity:1; transform: translateY(0) rotate(var(--r)) scale(1);} }
  .wish small{ display:block; font-style:italic; font-size: calc(var(--pw) * .045); margin-top: calc(var(--pw)*.015); color:#7a5a52; opacity:0; transition:opacity .6s 1.6s; }
  .cake-page.dark .wish small{ opacity:1; }

  /* ---------- controls ---------- */
  .controls{
    width: calc(var(--pw)*2); display:flex; gap:12px; margin-top:16px;
    opacity:0; pointer-events:none; transition:opacity .4s ease;
  }
  body.open .controls{ opacity:1; pointer-events:auto; transition-delay:.6s; }
  .controls .half{ flex:1; display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center; min-width:0; }
  .btn{
    font-family:inherit; font-weight:600; font-size:15px; color:var(--ink);
    background:var(--cream); border:0; padding:8px 14px; cursor:pointer; border-radius:2px;
    box-shadow: 0 2px 0 rgba(90,55,30,.25), 0 6px 12px -6px rgba(60,30,10,.5);
    transform: rotate(var(--r,-1deg)); transition: transform .15s ease, background .2s;
    user-select:none; -webkit-user-select:none; touch-action:none; white-space:nowrap;
  }
  .btn:hover{ transform: rotate(var(--r,-1deg)) translateY(-1px); }
  .btn:active, .btn.held{ transform: rotate(var(--r,-1deg)) translateY(1px) scale(.98); background:#f1dfe3; }
  .btn:focus-visible{ outline:2px dashed var(--rose); outline-offset:3px; }
  .btn[hidden], .meter[hidden]{ display:none; }
  .meter{
    display:flex; align-items:center; gap:6px; font-size:14px; font-style:italic;
  }
  .meter .bar{ position:relative; width:84px; height:10px; background:rgba(246,239,226,.85); border-radius:5px; overflow:hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,.2); }
  .meter .lvl{ position:absolute; inset:0 auto 0 0; width:0; background:linear-gradient(90deg,#a8b48e,#f4c97a,#e47f9f); border-radius:5px; transition: width .05s linear; }
  .meter .thr{ position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--ink); opacity:.55; left:40%; }
  .meter.blowing .bar{ box-shadow: 0 0 0 2px #e47f9f; }
  .note{ width:100%; text-align:center; font-size:13.5px; font-style:italic; color:#3d2a20; opacity:.85; min-height:1em; }

  .hint{
    margin-top:18px; font-style:italic; font-size:18px; color:#3d2a20;
    background:rgba(246,239,226,.75); padding:4px 14px; transform:rotate(-1.5deg);
    box-shadow:0 4px 10px -6px rgba(60,30,10,.5); transition:opacity .3s;
  }
  body.open .hint{ opacity:0; pointer-events:none; position:absolute; }

  canvas#confetti{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:30; }

  @media (prefers-reduced-motion: reduce){
    .book,.cover,.book-wrap{ transition-duration:.01s; }
    .flame img{ animation:none; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="book-wrap">
    <div class="book" id="book">
      <!-- right page: cake -->
      <section class="page cake-page" id="cakePage" aria-label="Blow out the candles">
        <img class="fill" id="cakeImg" alt="A painted cherry cake with two candles">
        <div class="wick" style="left:44.2%;top:47.6%"></div>
        <div class="wick" style="left:57.7%;top:47.6%"></div>
        <div class="flame f0" id="flame0" style="left:43%;top:46.22%;width:2.75%;height:2.72%"><div class="glow"></div><img id="flame0img" alt=""></div>
        <div class="flame f1" id="flame1" style="left:56.58%;top:46.22%;width:2.75%;height:2.94%"><div class="glow"></div><img id="flame1img" alt=""></div>
        <div class="wish" id="wish" aria-live="polite">
          <div class="row" id="wishRow1"></div>
          <div class="row" id="wishRow2"></div>
          <small>(now keep it a secret)</small>
        </div>
      </section>

      <!-- the cover: front = cover art, back = letter page -->
      <div class="cover" id="cover">
        <div class="face front" id="coverFront" role="button" tabindex="0" aria-label="Open the card">
          <img class="fill" id="coverImg" alt="Happy Birthday Zaeema">
          <span class="tape t1"></span><span class="tape t2"></span>
        </div>
        <div class="face back" id="letterPage">
          <img class="fill" id="envBack" alt="">
          <div class="letter-peek" id="letterPeek" role="button" tabindex="0" aria-label="Read the letter"><img id="peekImg" alt=""></div>
          <img class="fill env-front" id="envFront" alt="An envelope tied with a pink bow">
        </div>
      </div>
    </div>
  </div>

  <div class="hint" id="hint">tap the card to open</div>

  <div class="controls" id="controls">
    <div class="half">
      <button class="btn" id="backBtn" style="--r:-1.5deg">← back to cover</button>
    </div>
    <div class="half">
      <button class="btn" id="micBtn" style="--r:1deg">🎤 use mic</button>
      <div class="meter" id="meter" hidden><div class="bar"><div class="lvl" id="lvl"></div><div class="thr" id="thr"></div></div><span id="meterLbl">blow!</span></div>
      <button class="btn" id="holdBtn" style="--r:-1deg" title="or hold the spacebar">hold to blow</button>
      <button class="btn" id="relightBtn" style="--r:1.5deg" hidden>relight ✦</button>
      <div class="note" id="note"></div>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="letter-view" id="letterView" role="button" tabindex="0" aria-label="Put the letter back"><img id="viewImg" alt="Birthday letter from Raahyma"></div>
<div class="letter-hint" id="letterHint">tap to tuck it back in</div>
<canvas id="confetti"></canvas>

/* ---------- layout ---------- */
const root = document.documentElement;
let PW = 300, PH = 450;
function layout(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const top = Math.max(28, Math.round(vh * 0.06));
  const reserve = vw < 560 ? 150 : 96;          // room for controls under the spread
  const W = vw - 24, H = vh - top - reserve;
  PW = Math.floor(Math.max(120, Math.min(W / 2, H * 2 / 3, 560)));
  PH = Math.round(PW * 1.5);
  // closed cover: as big as fits (one page), capped
  const cw = Math.min(W, (vh - top - 70) * 2 / 3, 520);
  const cs = Math.max(1, cw / PW);
  root.style.setProperty('--pw', PW + 'px');
  root.style.setProperty('--ph', PH + 'px');
  root.style.setProperty('--cs', cs.toFixed(3));
  root.style.setProperty('--top', top + 'px');
  root.style.setProperty('--top-open', Math.max(top, Math.round((vh - PH - (vw < 560 ? 130 : 80)) / 2)) + 'px');
  if (reading) placeLetterView();
}
window.addEventListener('resize', layout);

/* ---------- open / close ---------- */
const body = document.body;
function openCard(){ if (!body.classList.contains('open')) body.classList.add('open'); }
function closeCard(){
  if (reading) tuck(true);
  body.classList.remove('open');
  stopHold();
}
$('coverFront').addEventListener('click', openCard);
$('coverFront').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCard(); }});
$('backBtn').addEventListener('click', closeCard);

/* ---------- letter: lift & tuck (FLIP onto a fixed overlay) ---------- */
let reading = false, letterAnim = null;
const peek = $('letterPeek'), view = $('letterView');
const LETTER_RATIO = 851 / 1199;

function targetRect(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const page = $('letterPage').getBoundingClientRect();
  let w, h, cx, cy;
  if (PW >= 260) {               // roomy: keep it over the left page with margins
    w = page.width * 0.84; h = w / LETTER_RATIO;
    if (h > page.height * 0.9) { h = page.height * 0.9; w = h * LETTER_RATIO; }
    cx = page.left + page.width / 2; cy = page.top + page.height / 2;
  } else {                       // small screens: give it room to be readable
    w = Math.min(vw - 40, (vh - 90) * LETTER_RATIO); h = w / LETTER_RATIO;
    cx = vw / 2; cy = vh / 2 - 10;
  }
  return { left: cx - w / 2, top: cy - h / 2, width: w, height: h };
}
function placeLetterView(){
  const t = targetRect();
  Object.assign(view.style, { left: t.left + 'px', top: t.top + 'px', width: t.width + 'px', height: t.height + 'px', display: 'block' });
  $('letterHint').style.top = Math.min(window.innerHeight - 28, t.top + t.height + 10) + 'px';
  return t;
}
function keyframes(){
  const s = peek.getBoundingClientRect();
  const envTop = $('letterPage').getBoundingClientRect().top + $('letterPage').getBoundingClientRect().height * 0.1683;
  const t = placeLetterView();
  const sc = s.width / t.width, dx = s.left - t.left, dy = s.top - t.top;
  const hidden = Math.max(0, Math.min(1, (s.bottom - envTop) / s.height));
  const lift = s.height * 0.32;
  const hidden2 = Math.max(0, hidden - lift / s.height);
  return [
    { offset: 0,   transform: `translate(${dx}px,${dy}px) scale(${sc})`, clipPath: `inset(0 0 ${hidden*100}% 0)`, boxShadow:'0 2px 4px rgba(40,20,10,.2)' },
    { offset: .38, transform: `translate(${dx}px,${dy - lift}px) scale(${sc})`, clipPath: `inset(0 0 ${hidden2*100}% 0)`, boxShadow:'0 4px 8px rgba(40,20,10,.25)', easing:'cubic-bezier(.5,0,.2,1)' },
    { offset: 1,   transform: `translate(0,0) scale(1) rotate(-1.2deg)`, clipPath: 'inset(0 0 0% 0)', boxShadow:'0 24px 50px -12px rgba(40,20,10,.6), 0 4px 10px rgba(40,20,10,.25)' }
  ];
}
function lift(){
  if (reading || !body.classList.contains('open')) return;
  reading = true;
  const kf = keyframes();
  peek.classList.add('gone');
  body.classList.add('reading');
  letterAnim = view.animate(kf, { duration: 900, easing: 'ease-out', fill: 'forwards' });
}
function tuck(instant){
  if (!reading) return;
  reading = false;
  body.classList.remove('reading');
  const done = () => { view.style.display = 'none'; peek.classList.remove('gone'); if (letterAnim) letterAnim.cancel(); };
  if (instant) return done();
  peek.classList.remove('gone'); peek.style.visibility = 'hidden';
  const kf = keyframes().reverse().map(k => ({ ...k, offset: 1 - k.offset }));
  kf[1].easing = 'cubic-bezier(.5,0,.2,1)';
  if (letterAnim) letterAnim.cancel();
  letterAnim = view.animate(kf, { duration: 800, easing: 'ease-in-out', fill: 'forwards' });
  letterAnim.onfinish = () => { peek.style.visibility = ''; done(); };
}
peek.addEventListener('click', lift);
$('envFront').addEventListener('click', lift);
peek.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); lift(); }});
view.addEventListener('click', () => tuck());
view.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') { e.preventDefault(); tuck(); }});
$('scrim').addEventListener('click', () => tuck());
document.addEventListener('keydown', e => { if (e.key === 'Escape' && reading) tuck(); });

/* ---------- candles ---------- */
const cakePage = $('cakePage');
const flames = [$('flame0'), $('flame1')];
const BASE = 'scale(1.3)';
flames.forEach(f => { f.style.setProperty('--base', BASE); f.style.transform = BASE; });
let lit = true;
let blowTime = 0;          // seconds of sustained blowing
const BLOW_NEEDED = 0.5;
let strength = 0;          // smoothed 0..1 blow strength for the bend
let micLevel = 0, micBlowing = false, micOn = false;
let holding = false, holdLevel = 0;

function bendFlames(s, t){
  flames.forEach((f, i) => {
    const gust = s > 0.02 ? Math.sin(t * 0.031 + i * 1.7) * 6 * s + Math.sin(t * 0.09 + i) * 3 * s : 0;
    const bend = s * 30 + gust;                                   // degrees, sideways
    const squash = 1 - s * 0.32, widen = 1 + s * 0.18;
    f.style.transform = `${BASE} rotate(${bend.toFixed(2)}deg) skewX(${(-bend * 0.8).toFixed(2)}deg) scale(${widen.toFixed(3)},${squash.toFixed(3)})`;
    f.style.opacity = (1 - Math.max(0, s - 0.6) * 0.9).toFixed(3);
  });
}
function blowOut(){
  if (!lit) return;
  lit = false; blowTime = 0;
  flames.forEach((f, i) => {
    f.classList.add('out');
    f.style.transform = `${BASE} rotate(70deg) skewX(-30deg) scale(.3,.2)`;
    for (let k = 0; k < 3; k++) {
      const p = document.createElement('div');
      p.className = 'smoke';
      const fl = parseFloat(f.style.left) + parseFloat(f.style.width) / 2;
      p.style.left = fl + '%'; p.style.top = (parseFloat(f.style.top) - 0.5) + '%';
      p.style.setProperty('--dx', (10 + k * 25 + Math.random() * 20) + '%');
      p.style.animationDelay = (k * 0.22 + i * 0.08) + 's';
      cakePage.appendChild(p);
      setTimeout(() => p.remove(), 3500);
    }
  });
  cakePage.classList.add('dark');
  $('holdBtn').hidden = true;
  $('relightBtn').hidden = false;
  setTimeout(() => { buildWish(); confettiBurst(); }, 450);
}
function relight(){
  lit = true; blowTime = 0; strength = 0;
  cakePage.classList.remove('dark');
  flames.forEach(f => {
    f.classList.remove('out');
    f.style.transform = BASE; f.style.opacity = '';
    f.classList.remove('relight'); void f.offsetWidth; f.classList.add('relight');
    setTimeout(() => f.classList.remove('relight'), 650);
  });
  $('holdBtn').hidden = false;
  $('relightBtn').hidden = true;
}
$('relightBtn').addEventListener('click', relight);

/* the "make a wish, Zaeema" tiles, styled like the cut-out letters on the card */
const TILE_COLORS = [
  ['#e39bb3','#fbe7ee'],['#a6a3cf','#eef6c9'],['#f3c976','#7d9b8f'],['#8fa07f','#f6f0ff'],
  ['#c45a85','#cfd6ff'],['#5f80a5','#fff3b0'],['#a8b48e','#ffb08a'],['#b49a9e','#f6dcef'],['#e7a1b6','#ffd0a6']
];
function tilesInto(el, text, startDelay){
  el.innerHTML = '';
  [...text].forEach((ch, i) => {
    const s = document.createElement('span');
    s.className = 'tile' + (ch === ' ' ? ' sp' : '');
    s.textContent = ch === ' ' ? '' : ch;
    const [bg, fg] = TILE_COLORS[(i * 5 + text.length) % TILE_COLORS.length];
    s.style.background = bg; s.style.color = fg;
    s.style.setProperty('--r', ((Math.random() * 14 - 7)).toFixed(1) + 'deg');
    s.style.setProperty('--d', (startDelay + i * 0.06).toFixed(2) + 's');
    el.appendChild(s);
  });
}
function buildWish(){
  tilesInto($('wishRow1'), 'make a wish,', 0.05);
  tilesInto($('wishRow2'), NAME, 0.8);
}

/* ---------- blow input: hold-to-blow fallback ---------- */
function startHold(e){ if (e) e.preventDefault(); if (!body.classList.contains('open') || reading) return; holding = true; $('holdBtn').classList.add('held'); }
function stopHold(){ holding = false; $('holdBtn').classList.remove('held'); }
const hb = $('holdBtn');
hb.addEventListener('pointerdown', e => { hb.setPointerCapture?.(e.pointerId); startHold(e); });
hb.addEventListener('pointerup', stopHold);
hb.addEventListener('pointercancel', stopHold);
hb.addEventListener('lostpointercapture', stopHold);
hb.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && body.classList.contains('open') && !reading && document.activeElement?.id !== 'backBtn') {
    e.preventDefault(); if (!e.repeat) startHold();
  }
});
document.addEventListener('keyup', e => { if (e.code === 'Space') stopHold(); });

/* ---------- blow input: microphone (Web Audio) ---------- */
let analyser, timeBuf, freqBuf, audioCtx, binHz;
let noiseFloor = 0.01, thr = 0.08;
function setNote(msg){ $('note').textContent = msg; }

async function startMic(){
  if (micOn) return;
  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
    setNote('the mic only works when this card is opened from an https link. use “hold to blow” for now.');
    return;
  }
  try {
    $('micBtn').disabled = true; $('micBtn').textContent = 'asking…';
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    const src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024; analyser.smoothingTimeConstant = 0.3;
    src.connect(analyser);
    timeBuf = new Float32Array(analyser.fftSize);
    freqBuf = new Uint8Array(analyser.frequencyBinCount);
    binHz = audioCtx.sampleRate / analyser.fftSize;
    micOn = true;
    $('micBtn').hidden = true;
    $('meter').hidden = false;
    setNote('blow at your screen like it’s a real cake');
  } catch (err) {
    $('micBtn').disabled = false; $('micBtn').textContent = '🎤 use mic';
    setNote(err && err.name === 'NotAllowedError'
      ? 'mic blocked — allow it in your browser, or use “hold to blow”.'
      : 'couldn’t reach a mic — use “hold to blow” instead.');
  }
}
$('micBtn').addEventListener('click', startMic);

function readMic(){
  analyser.getFloatTimeDomainData(timeBuf);
  let sum = 0;
  for (let i = 0; i < timeBuf.length; i++) sum += timeBuf[i] * timeBuf[i];
  const rms = Math.sqrt(sum / timeBuf.length);
  analyser.getByteFrequencyData(freqBuf);
  // blowing on a mic = broadband rumble, heavy in the low end
  let low = 0, all = 0;
  const lowCut = Math.round(600 / binHz), hiCut = Math.round(8000 / binHz);
  for (let i = 1; i < Math.min(hiCut, freqBuf.length); i++) { all += freqBuf[i]; if (i < lowCut) low += freqBuf[i]; }
  const lowShare = all > 0 ? low / all : 0;
  // adapt to the room: track the quiet level slowly
  if (rms < thr * 0.6) noiseFloor = noiseFloor * 0.98 + rms * 0.02;
  thr = Math.max(0.045, noiseFloor * 5);
  const level = Math.min(1, rms / (thr * 2.5));
  micLevel = micLevel * 0.5 + level * 0.5;
  micBlowing = rms > thr && lowShare > 0.06;
  $('lvl').style.width = (micLevel * 100).toFixed(1) + '%';
  $('thr').style.left = (100 / 2.5).toFixed(1) + '%';
  $('meter').classList.toggle('blowing', micBlowing);
  $('meterLbl').textContent = micBlowing ? 'whoosh!' : 'blow!';
}

/* ---------- main loop ---------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (micOn) readMic();
  holdLevel += ((holding ? 0.85 : 0) - holdLevel) * Math.min(1, dt * 10);
  const blowing = (micOn && micBlowing) || holding;
  const target = Math.max(micOn ? (micBlowing ? Math.max(0.45, micLevel) : micLevel * 0.25) : 0, holdLevel);
  strength += (target - strength) * Math.min(1, dt * 12);
  if (lit) {
    if (blowing && body.classList.contains('open') && !reading) blowTime += dt;
    else blowTime = Math.max(0, blowTime - dt * 1.5);
    bendFlames(lit ? strength : 0, now);
    if (blowTime >= BLOW_NEEDED) blowOut();
  }
  stepConfetti(dt);
  requestAnimationFrame(frame);
}

/* ---------- confetti ---------- */
const cv = $('confetti'), cx = cv.getContext('2d');
let bits = [];
function sizeCanvas(){ const d = window.devicePixelRatio || 1; cv.width = innerWidth * d; cv.height = innerHeight * d; cx.setTransform(d,0,0,d,0,0); }
window.addEventListener('resize', sizeCanvas);
const CONF = ['#e39bb3','#a6a3cf','#f3c976','#8fa07f','#c45a85','#5f80a5','#ffb08a','#f6f0ff','#e47f9f'];
function confettiBurst(){
  const r = cakePage.getBoundingClientRect();
  const ox = r.left + r.width * 0.5, oy = r.top + r.height * 0.47;
  for (let i = 0; i < 160; i++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.0;
    const sp = 260 + Math.random() * 520;
    bits.push({ x: ox + (Math.random() - .5) * r.width * .2, y: oy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      w: 5 + Math.random() * 7, h: 3 + Math.random() * 5, rot: Math.random() * 6, vr: (Math.random() - .5) * 14,
      c: CONF[i % CONF.length], life: 3.2 + Math.random() * 1.5, shape: Math.random() < 0.25 ? 'heart' : 'rect' });
  }
}
function heart(ctx, s){
  ctx.beginPath(); ctx.moveTo(0, s * .3);
  ctx.bezierCurveTo(-s, -s * .4, -s * .4, -s, 0, -s * .4);
  ctx.bezierCurveTo(s * .4, -s, s, -s * .4, 0, s * .3); ctx.fill();
}
function stepConfetti(dt){
  cx.clearRect(0, 0, innerWidth, innerHeight);
  if (!bits.length) return;
  bits = bits.filter(b => (b.life -= dt) > 0 && b.y < innerHeight + 40);
  for (const b of bits) {
    b.vy += 700 * dt; b.vx *= (1 - 1.6 * dt); b.vy *= (1 - 1.1 * dt);
    b.x += b.vx * dt + Math.sin(b.rot) * 20 * dt; b.y += b.vy * dt; b.rot += b.vr * dt;
    cx.save(); cx.translate(b.x, b.y); cx.rotate(b.rot); cx.globalAlpha = Math.min(1, b.life);
    cx.fillStyle = b.c;
    if (b.shape === 'heart') heart(cx, b.w * .9);
    else { cx.scale(1, Math.cos(b.rot * 1.3)); cx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); }
    cx.restore();
  }
}

/* ---------- go ---------- */
if (!window.isSecureContext) setNote('heads up: blowing with the mic needs an https link. hold the button meanwhile.');
layout(); sizeCanvas(); requestAnimationFrame(frame);

/* tiny test hook (harmless) */
window.__card = { get lit(){ return lit; }, get blowTime(){ return blowTime; }, get reading(){ return reading; }, get micOn(){ return micOn; } };
</script>
